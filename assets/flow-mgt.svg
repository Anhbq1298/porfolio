<text x="351" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".9" fill="#1F4788">02  COMPUTATIONAL SOLUTION</text>
<text x="351" y="127" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033">Grasshopper geometry and</text>
<text x="351" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033">CSI API component workflow</text>
<rect x="648" y="65" width="275" height="125" rx="13" fill="#EDF5F1" stroke="#D7E2ED"/>
<text x="666" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".9" fill="#1F4788">03  REVIEWABLE OUTCOME</text>
<text x="666" y="127" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033">Parametric models and</text>

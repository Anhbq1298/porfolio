<title id="title">MGT — problem to solution</title>
<desc id="desc">Engineering problem, computational approach, and output in three connected panels.</desc>
<rect width="940" height="240" rx="14" fill="#FFFFFF"/>
<text x="18" y="37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#172033">MGT</text>
<rect x="18" y="65" width="275" height="125" rx="13" fill="#EDF2F8" stroke="#D7E2ED"/>
<text x="36" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".9" fill="#1F4788">01  ENGINEERING PROBLEM</text>
<text x="36" y="127" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033">Manual Rhino-to-CSI transfer</text>
<text x="36" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172033">and duplicated modelling</text>

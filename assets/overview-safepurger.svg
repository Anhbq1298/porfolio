<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" role="img" aria-labelledby="title desc">
<title id="title">SAFE Model Purger — problem to solution</title>
<desc id="desc">Engineering problem, computational approach, and output in three connected panels.</desc>
<rect width="940" height="190" rx="14" fill="#FFFFFF"/>
<text x="18" y="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#172033">SAFE Model Purger</text>
<rect x="18" y="50" width="275" height="105" rx="13" fill="#FFF1ED" stroke="#F1CDC6"/>
<text x="36" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".9" fill="#A64136">PROBLEM</text>
<text x="36" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">Duplicate model</text>
<text x="36" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">property definitions</text>
<rect x="333" y="50" width="275" height="105" rx="13" fill="#E8F0FD" stroke="#C9D9F2"/>
<text x="351" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".9" fill="#1F4788">SOLUTION</text>
<text x="351" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">Detect and merge</text>
<text x="351" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">compatible objects</text>
<rect x="648" y="50" width="275" height="105" rx="13" fill="#EDF5F1" stroke="#C9DCCF"/>
<text x="666" y="77" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing=".9" fill="#286846">OUTPUT</text>
<text x="666" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">Cleaner and</text>
<text x="666" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">auditable model</text>
